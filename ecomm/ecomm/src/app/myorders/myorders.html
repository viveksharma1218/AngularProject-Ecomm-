<h3>My Orders</h3>
<div class="container">
    @for(data of orderData; track $index){
    <div class="Box">
            <div class="icon box"> <img src="./cart.png"></div>
            <div class="orderId box">Order Id: {{data.id}}</div>
            <div class="price box">price:{{data.price}}</div>
            <div class="status box">status:</div>
            <div class=" cancel box"><button class="btn btn-danger"
                (click)="data.id && cancelOrder(data.id)">Cancel Order</button></div>
    </div>
    }

   
</div>
