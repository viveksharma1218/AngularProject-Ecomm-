<div class="headerBox">
    <div class="logoBox" routerLink="">
        <h2>Ecomm</h2>
    </div>
    @if(headerType() === 'default'){
        <div class="searchBox">
            <input type="search" placeholder="search product here">
            <button>Search</button>
        </div>
        <div class="linksBox">
            <button routerLink="seller-auth">Seller</button>
            <button routerLink="">Home</button>
            <button>Login</button>
            <button>Cart</button>
        </div>
    }
    @if(headerType() === 'seller'){
        <div class="sellerlinksBox linksBox">
            <button routerLink="">Home</button>
            <button class="sellerlinksBoxButton" routerLink="seller-add-product">Add Product</button>
            <!--this is seller home-->
            <button routerLink="seller-home">List</button>
            <button (click)="logout()">Logout</button>
            <button>{{sellerName}} </button>
        </div>
    }
    
</div>
