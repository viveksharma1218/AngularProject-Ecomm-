<!-- {{product}} -->
<div class="container">
    <div class="firstBox">
        <img src="./1.jpg">
    </div>
    <div class="secondBox">
        <p>Product Name : {{product.name}}</p>
        <p>Product Id : {{product.id}}</p>
        <p>Category : {{product.category}}</p>
        <div class="colorBox">
             <p>Color : </p>
             <div class="color" [style.backgroundColor]="product.color"></div>
             <p> {{product.color}}</p>
        </div>
       
        <p>Price : {{product.price}}</p>
        <p>Description : {{product.description}}</p>
    </div>
    <div class="thirdBox">
        <button class="btn btn-primary">Buy Now</button>
        @if(productAlreadyBought()){
            <button class="btn btn-primary">Remove From Cart</button>
        }
        @else{
            <button class="btn btn-primary" (click)="addToCart()">Add to Cart</button>
        }
        
        <button class="btn btn-primary" (click)="editQuantiry('add')">+</button>
        <button class="btn btn-primary">Qty:{{productQuantity}}</button>
        <button class="btn btn-primary" (click)="editQuantiry('sub')">-</button>
    </div>
</div>
@if(popUp1()){
    <div class="popUp1">
        <div>
            <h3>Product Added to cart</h3>
        </div>
    </div>
}
