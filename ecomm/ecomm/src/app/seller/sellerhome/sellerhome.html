<div class="container" >
    @for(product of productList();track $index){
        <div class="box" >
            
        <div class="Image">
            <img src="/iphone.webp"  alt="i phone image" class="image">
            <button (click)="deleteProduct(product.id)" class="deleteButton">
                <fa-icon [icon]="Icon" />Delete</button>
            <button  class="EditButton" routerLink="/seller-update-product/{{product.id}}">
                <fa-icon [icon]="editIcon" />Edit</button>    
            <p class="id">{{product.id}}</p>
           
        </div>
        <div class="Name">{{product.name}}</div>
        <div class="Price"><strong>Price:</strong>{{product.price}}</div>
        <div class="Color"><strong>Color:</strong>{{product.color}}</div>
        <div class="Category"><strong>Category:</strong>{{product.category}}</div>
        <div class="description"><strong>Description:</strong>{{product.description}}</div>

         
    </div>
    }
